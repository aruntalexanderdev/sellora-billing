name: Deploy claude-dev

# Deploys branch claude_dev → GitHub environment "claude-dev" (API + frontend).
# Push-triggered since rollout step 1; the legacy claude-dev workflows were retired in step 2
# (.github/workflows-retired/), so this is the only workflow that deploys claude-dev.
on:
  push:
    branches: [claude_dev]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-claude-dev
  cancel-in-progress: false # never stop a deploy halfway; a newer run waits

jobs:
  guard:
    name: Check branch
    runs-on: ubuntu-latest
    steps:
      - name: Only the claude_dev branch deploys to claude-dev
        if: github.ref_name != 'claude_dev'
        run: |
          echo "::error::Run this workflow on branch 'claude_dev' (selected: '${{ github.ref_name }}')."
          exit 1

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    uses: ./.github/workflows/_deploy-template.yml
    # Environment secrets reach a reusable workflow only when the caller passes them (the vars context works without this).
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      environment: claude-dev
      deploy_frontend: true
      run_migrations: true # db-release-automation: claude-dev first; enable for dev once a claude-dev run is green
