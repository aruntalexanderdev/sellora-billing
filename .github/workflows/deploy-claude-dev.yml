name: Deploy claude-dev

# Deploys branch claude_dev → GitHub environment "claude-dev" (API + frontend).
# Rollout step 1: the push trigger is enabled so this workflow runs at all ("Run workflow" needs the file on the default
# branch, which it is not on). Until step 2 retires dev_sellora-billing-dev-api-claude.yml and
# azure-static-web-apps-wonderful-bay-04d447700.yml, a push touching backend/** also starts the legacy API deploy (no migrations),
# and every push also starts the legacy frontend deploy. Step 2 moves both out of .github/workflows/ once a run here is green.
on:
  push:
    branches: [claude_dev]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-claude-dev
  cancel-in-progress: false # never stop a deploy halfway; a newer run waits

jobs:
  guard:
    name: Check branch
    runs-on: ubuntu-latest
    steps:
      - name: Only the claude_dev branch deploys to claude-dev
        if: github.ref_name != 'claude_dev'
        run: |
          echo "::error::Run this workflow on branch 'claude_dev' (selected: '${{ github.ref_name }}')."
          exit 1

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    uses: ./.github/workflows/_deploy-template.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: claude-dev
      deploy_frontend: true
      run_migrations: true # db-release-automation: claude-dev first; enable for dev once a claude-dev run is green
