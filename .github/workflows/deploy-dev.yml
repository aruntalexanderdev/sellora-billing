name: Deploy dev

# Deploys branch dev → GitHub environment "dev" (API only; dev has no Static Web App yet).
# Rollout: manual only for now. When a manual run is green, enable the push trigger below and delete
# dev_sellora-billing-dev-api.yml in the same commit, so one push never deploys twice.
on:
  # push:
  #   branches: [dev]
  #   paths-ignore:
  #     - "docs/**"
  #     - "**/*.md"
  #     - ".claude/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false # never stop a deploy halfway; a newer run waits

jobs:
  guard:
    name: Check branch
    runs-on: ubuntu-latest
    steps:
      - name: Only the dev branch deploys to dev
        if: github.ref_name != 'dev'
        run: |
          echo "::error::Run this workflow on branch 'dev' (selected: '${{ github.ref_name }}')."
          exit 1

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    uses: ./.github/workflows/_deploy-template.yml
    # Environment secrets reach a reusable workflow only when the caller passes them (the vars context works without this).
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      deploy_frontend: false # set to true once dev has its own Static Web App and token
