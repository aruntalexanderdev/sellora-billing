name: CI

# Tests only; never deploys.
# - Development branches: runs on every push.
# - dev / claude_dev: skipped on push, because deploy-dev.yml / deploy-claude-dev.yml call this
#   workflow (workflow_call) as their first job, so tests gate every deploy without running twice.
on:
  push:
    branches-ignore:
      - dev
      - claude_dev
  pull_request:
    branches:
      - main
      - dev
      - claude_dev
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  SOLUTION_PATH: "backend/Sellora.slnx"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    # The Testcontainers integration suite alone takes ~20 min; 20 here cancelled every run since 2026-11-10.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build solution
        run: >
          dotnet build "${{ env.SOLUTION_PATH }}"
          --configuration Release
          --no-restore

      # Fails when an entity/configuration changed without a matching migration.
      - name: Check for missing EF Core migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes \
            --project backend/src/Sellora.Infrastructure \
            --startup-project backend/src/Sellora.Infrastructure \
            --configuration Release \
            --no-build

      # Docker is available on ubuntu-latest, so Testcontainers-based integration tests run here too.
      - name: Test
        run: >
          dotnet test "${{ env.SOLUTION_PATH }}"
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults
          --blame-hang-timeout 10m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7

  db-scripts:
    name: Data scripts unchanged
    # Pull requests only: the base branch is known there. The deploy pipeline's migrator enforces the same rule per database.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that merged data scripts were not edited
        run: >
          scripts/check-db-scripts.sh
          "origin/${{ github.base_ref }}"
          "${{ contains(github.event.pull_request.labels.*.name, 'db-script-fix') && 'allow-fix' || '' }}"

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npx ng test --watch=false
