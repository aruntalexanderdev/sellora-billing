
name: Deploy Sellora Billing Backend

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "backend/Sellora.slnx"
  API_PROJECT_PATH: "backend/src/Sellora.Api/Sellora.Api.csproj"
  PUBLISH_DIR: "${{ github.workspace }}/publish"
  AZURE_WEBAPP_NAME: "sellora-billing-dev-api"

jobs:
  build-and-publish:
    name: Build and Publish Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify backend paths
        run: |
          echo "Repository root:"
          pwd

          echo "Solution files:"
          find backend -maxdepth 3 -type f \
            \( -name "*.sln" -o -name "*.slnx" \)

          echo "Project files:"
          find backend -maxdepth 5 -type f -name "*.csproj"

          test -f "${{ env.SOLUTION_PATH }}" || {
            echo "ERROR: Solution file not found: ${{ env.SOLUTION_PATH }}"
            exit 1
          }

          test -f "${{ env.API_PROJECT_PATH }}" || {
            echo "ERROR: API project not found: ${{ env.API_PROJECT_PATH }}"
            exit 1
          }

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build solution
        run: >
          dotnet build "${{ env.SOLUTION_PATH }}"
          --configuration Release
          --no-restore

      - name: Publish API
        run: >
          dotnet publish "${{ env.API_PROJECT_PATH }}"
          --configuration Release
          --no-build
          --output "${{ env.PUBLISH_DIR }}"

      - name: Verify published output
        run: |
          test -f "${{ env.PUBLISH_DIR }}/Sellora.Api.dll" || {
            echo "ERROR: Sellora.Api.dll was not found in the publish output."
            echo "Published files:"
            find "${{ env.PUBLISH_DIR }}" -maxdepth 2 -type f
            exit 1
          }

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: sellora-backend-publish
          path: ${{ env.PUBLISH_DIR }}/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-publish

    environment:
      name: development

    steps:
      - name: Download published API
        uses: actions/download-artifact@v4
        with:
          name: sellora-backend-publish
          path: ./publish

      - name: Verify deployment package
        run: |
          test -f "./publish/Sellora.Api.dll" || {
            echo "ERROR: Published API DLL is missing."
            exit 1
          }

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
