
name: Deploy Sellora Billing Backend

on:
  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "backend/Sellora.slnx"
  API_PROJECT_PATH: "backend/src/Sellora.Api/Sellora.Api.csproj"
  PUBLISH_DIR: "./publish"

jobs:
  build-and-publish:
    name: Build and Publish Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build solution
        run: >
          dotnet build "${{ env.SOLUTION_PATH }}"
          --configuration Release
          --no-restore

      # Unit tests are intentionally skipped for now.
      # Add a dotnet test step here when testing is enabled.

      - name: Publish API
        run: >
          dotnet publish "${{ env.API_PROJECT_PATH }}"
          --configuration Release
          --no-build
          --output "${{ env.PUBLISH_DIR }}"

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: sellora-backend-publish
          path: ${{ env.PUBLISH_DIR }}/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download published API
        uses: actions/download-artifact@v4
        with:
          name: sellora-backend-publish
          path: ./publish

      # Azure authentication and deployment steps
      # will be added after configuring the Azure App Service.
