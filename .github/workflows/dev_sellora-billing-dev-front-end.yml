```yaml
# Build and deploy Sellora Billing Angular frontend to Azure App Service

name: Build and deploy Angular frontend to Azure Web App - sellora-billing-dev-front-end

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Angular project
        id: locate
        shell: bash
        run: |
          echo "Searching for Angular project..."

          PACKAGE_FILES=$(find . \
            -maxdepth 5 \
            -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*')

          echo "$PACKAGE_FILES"

          PROJECT_DIR=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            dir=$(dirname "$file")

            if [ -f "$dir/angular.json" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done <<< "$PACKAGE_FILES"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Angular project not found. Check that package.json and angular.json are committed to the dev branch."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=""
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Angular project directory: ${PROJECT_DIR:-repository root}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '${{ steps.locate.outputs.project_dir }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir || '.' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::error::package-lock.json not found. Commit your Angular project's package-lock.json."
            exit 1
          fi

      - name: Build Angular application
        working-directory: ${{ steps.locate.outputs.project_dir || '.' }}
        run: npm run build

      - name: Locate production build output
        id: output
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir || '.' }}
        run: |
          if [ ! -f angular.json ]; then
            echo "::error::angular.json not found."
            exit 1
          fi

          BUILD_DIR=$(node -e "
            const fs = require('fs');
            const config = JSON.parse(fs.readFileSync('angular.json', 'utf8'));
            const projects = config.projects || {};
            for (const [name, project] of Object.entries(projects)) {
              const build = project.architect?.build || project.targets?.build;
              if (build && build.options?.outputPath) {
                console.log(build.options.outputPath);
                break;
              }
            }
          ")

          if [ -z "$BUILD_DIR" ] || [ ! -d "$BUILD_DIR" ]; then
            echo "::error::Could not locate the Angular build output. Check angular.json and the build configuration."
            exit 1
          fi

          # Angular may place browser files inside a browser subdirectory.
          if [ -f "$BUILD_DIR/browser/index.html" ]; then
            BUILD_DIR="$BUILD_DIR/browser"
          elif [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "::error::index.html not found in the Angular build output."
            find "$BUILD_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Production output: $BUILD_DIR"
          echo "path=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/angular-deploy"
          cp -a "${{ steps.locate.outputs.project_dir }}/${{ steps.output.outputs.path }}/." "${RUNNER_TEMP}/angular-deploy/"

          # Configure App Service to serve the Angular SPA and support route fallback.
          cat > "${RUNNER_TEMP}/angular-deploy/web.config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="Angular Routes" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-frontend
          path: ${{ runner.temp }}/angular-deploy/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-frontend
          path: ./deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_73FFDB942B724293A533D355A75E9F17 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F4F48F463B194B5898EE9DEF2DCF3314 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9ECA9B4AC3364850873F7880EA385D03 }}

      - name: Deploy Angular frontend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: sellora-billing-dev-front-end
          slot-name: Production
          package: ./deploy
```
