
# Build and deploy Sellora Billing Angular frontend to Azure App Service

name: Build and deploy Angular frontend to Azure Web App - sellora-billing-dev-front-end

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Angular project
        id: locate
        shell: bash
        run: |
          echo "Searching for Angular project..."

          PACKAGE_FILES=$(find . \
            -maxdepth 5 \
            -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*')

          echo "$PACKAGE_FILES"

          PROJECT_DIR=""

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            dir=$(dirname "$file")

            if [ -f "$dir/angular.json" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done <<< "$PACKAGE_FILES"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Angular project not found. Check that package.json and angular.json are committed to the dev branch."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          if [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR=""
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Angular project directory: ${PROJECT_DIR:-repository root}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '${{ steps.locate.outputs.project_dir }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ steps.locate.outputs.project_dir || '.' }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::error::package-lock.json not found. Commit your Angular project's package-lock.json."
            exit 1
          fi

      - name: Build Angular application
        working-directory: ${{ steps.locate.outputs.project_dir || '.' }}
        run: npm run build

      - name: Locate production build output
        id: output
        shell: bash
        working-directory: ${{ steps.locate.outputs.project_dir || '.' }}
        run: |
          echo "Reading Angular build configuration..."

          if [ ! -f angular.json ]; then
            echo "::error::angular.json not found in the Angular project directory."
            exit 1
          fi

          BUILD_DIR=$(node <<'NODE'
          const fs = require('fs');

          const config = JSON.parse(
            fs.readFileSync('angular.json', 'utf8')
          );

          for (const [name, project] of Object.entries(config.projects || {})) {
            const target = project.architect?.build || project.targets?.build;

            if (!target) continue;

            const output = target.options?.outputPath;

            if (typeof output === 'string') {
              console.log(output);
              process.exit(0);
            }

            if (output && typeof output === 'object' && output.base) {
              console.log(output.base);
              process.exit(0);
            }
          }

          process.exit(1);
          NODE
          ) || true

          if [ -n "$BUILD_DIR" ] && [ -d "$BUILD_DIR" ]; then
            if [ -f "$BUILD_DIR/browser/index.html" ]; then
              BUILD_DIR="$BUILD_DIR/browser"
            fi
          else
            echo "Configured output directory not found. Searching dist..."
            BUILD_DIR=""

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              if [[ "$file" == *"/node_modules/"* ]]; then
                continue
              fi

              BUILD_DIR=$(dirname "$file")
              break
            done < <(
              find dist \
                -type f \
                -name index.html \
                -not -path '*/node_modules/*' \
                2>/dev/null
            )
          fi

          if [ -z "$BUILD_DIR" ] || [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "::error::Angular production index.html was not found."
            echo "Inspecting project build configuration:"
            node -e "
              const c = require('./angular.json');
              console.log(JSON.stringify(c.projects, null, 2));
            "
            echo "Build output files:"
            find dist -maxdepth 5 -type f 2>/dev/null | head -100 || true
            exit 1
          fi

          echo "Angular production directory: $BUILD_DIR"
          echo "path=$BUILD_DIR" >> "$GITHUB_OUTPUT"

      - name: Prepare deployment package
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/angular-deploy"
          cp -a "${{ steps.locate.outputs.project_dir }}/${{ steps.output.outputs.path }}/." "${RUNNER_TEMP}/angular-deploy/"

          # Configure App Service to serve the Angular SPA and support route fallback.
          cat > "${RUNNER_TEMP}/angular-deploy/web.config" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <system.webServer>
              <rewrite>
                <rules>
                  <rule name="Angular Routes" stopProcessing="true">
                    <match url=".*" />
                    <conditions logicalGrouping="MatchAll">
                      <add input="{REQUEST_FILENAME}" matchType="IsFile" negate="true" />
                      <add input="{REQUEST_FILENAME}" matchType="IsDirectory" negate="true" />
                    </conditions>
                    <action type="Rewrite" url="/" />
                  </rule>
                </rules>
              </rewrite>
            </system.webServer>
          </configuration>
          EOF

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-frontend
          path: ${{ runner.temp }}/angular-deploy/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-frontend
          path: ./deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_73FFDB942B724293A533D355A75E9F17 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F4F48F463B194B5898EE9DEF2DCF3314 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9ECA9B4AC3364850873F7880EA385D03 }}

      - name: Deploy Angular frontend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: sellora-billing-dev-front-end
          slot-name: Production
          package: ./deploy
