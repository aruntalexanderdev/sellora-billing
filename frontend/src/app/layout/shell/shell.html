<div class="shell-grid" [class.sidebar-collapsed]="!sidebarOpen()">
  @if (sidebarOpen()) {
    <div class="shell-backdrop" (click)="closeSidebar()"></div>
  }

  <app-sidebar [navGroups]="navGroups()" [companyName]="companyName()" [branchName]="branchName()" [open]="sidebarOpen()" (closeRequested)="closeSidebar()" />

  <div class="shell-content">
    <app-header
      [userName]="currentUser() ? currentUser()!.firstName + ' ' + currentUser()!.lastName : ''"
      [userRole]="currentUser()?.roleName ?? ''"
      [userInitials]="userInitials()"
      [companies]="companies()"
      [companyId]="companyId()"
      [branches]="allowedBranches()"
      [branchId]="workingBranchId()"
      [canChooseAll]="canChooseAll()"
      (branchChange)="switchBranch($event)"
      (companyChange)="switchCompany($event)"
      (signOut)="signOut()"
      (menuToggle)="toggleSidebar()"
    />

    <main class="shell-main">
      @for (key of contextKey(); track key) {
        <router-outlet />
      }
    </main>
  </div>
</div>

<ui-toast-host />
<ui-confirm-dialog-host />
