<div class="page-head">
  <div>
    <h1>Stock overview</h1>
    <p>Available quantity, average cost and stock status for every product.</p>
  </div>
</div>

<ui-company-view-toggle permission="Inventory.View" (changed)="onCompanyViewChange()" />

<div style="margin-bottom: 12px; max-width: 280px">
  <app-location-select purpose="filter" label="Filter by location" [value]="locationId()" (valueChange)="onLocationChange($event)" />
</div>

<ui-data-table
  [cols]="cols"
  [rows]="rows()"
  [state]="state()"
  [showSearch]="true"
  [searchValue]="search()"
  searchPlaceholder="Search items…"
  emptyTitle="No items match that search"
  emptyBody="Clear the search box, or add products from Inventory → Products."
  (searchChange)="onSearch($event)"
  (retry)="retry()"
  [footerText]="total() + ' item' + (total() === 1 ? '' : 's')"
  [page]="page()"
  [hasMore]="hasMore()"
  (pageChange)="onPageChange($event)"
/>
