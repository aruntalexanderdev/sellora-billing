<div class="denied-card">
  <div class="denied-icon">✕</div>
  <div class="denied-title">You don't have access to this page</div>
  <div class="denied-body">
    The <strong>{{ auth.currentUser()?.roleName }}</strong> role does not include the
    @if (permission) {
      <code>{{ permission }}</code>
    } @else {
      permission
    }
    required here. Ask an administrator to grant it.
  </div>
  <ui-button variant="primary" (onClick)="goToDashboard()">Back to Administration</ui-button>
</div>
