<div class="page-head">
  <div>
    <h1>Current stock report</h1>
    <p>Available quantity, cost and selling value for every product, as of right now.</p>
  </div>
</div>

<ui-company-view-toggle permission="Reports.Stock" (changed)="onCompanyViewChange()" />

@if (showLocation()) {
  <div class="report-filters">
    <app-scope-filters [showBranch]="false" [stockLocationId]="stockLocationId()" (stockLocationIdChange)="onLocationChange($event)" />
  </div>
}

<div style="margin-bottom: 12px">
  <app-category-filter [categoryId]="categoryId()" [subcategoryId]="subcategoryId()" (changed)="onCategoryChange($event)" />
</div>

<app-load-error [message]="errorMessage()" />

<ui-data-table
  [cols]="cols"
  [rows]="rows()"
  [state]="state()"
  [showSearch]="true"
  [searchValue]="search()"
  searchPlaceholder="Search items…"
  [filters]="filters()"
  emptyTitle="No items match these filters"
  emptyBody="Clear the search or filters to see the full stock position."
  (searchChange)="onSearch($event)"
  (retry)="retry()"
  [footerText]="total() + ' item' + (total() === 1 ? '' : 's')"
  [page]="page()"
  [hasMore]="hasMore()"
  (pageChange)="onPageChange($event)"
/>
