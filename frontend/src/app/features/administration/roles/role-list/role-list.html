<div class="page-head">
  <div>
    <h1>Roles &amp; permissions</h1>
    <p>Each role is a set of module permissions. Changes apply to every user holding the role.</p>
  </div>
  @if (canCreate()) {
    <ui-button variant="primary" (onClick)="goToCreate()">+ New role</ui-button>
  }
</div>

<div class="filters">
  <select class="field-input" aria-label="Role scope" [value]="scope()" (change)="setScope($any($event.target).value)">
    @if (canViewCompany()) {
      <option value="Company">Company roles</option>
    }
    <option value="Branch">Branch roles</option>
  </select>
  @if (scope() === 'Branch') {
    <select class="field-input" aria-label="Branch" [value]="branchId()" (change)="setBranch($any($event.target).value)">
      <option value="">All branches</option>
      @for (b of branches(); track b.id) {
        <option [value]="b.id">{{ b.name }} ({{ b.code }})</option>
      }
    </select>
  }
</div>

<ui-data-table
  [cols]="cols"
  [rows]="rows()"
  [state]="state()"
  emptyTitle="No roles yet"
  emptyBody="Create a role to start mapping permissions."
  (retry)="retry()"
/>
